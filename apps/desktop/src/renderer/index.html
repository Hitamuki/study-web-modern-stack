<!DOCTYPE html>
<html lang="ja">
  <head>
    <!-- アセットの相対参照をルートから解決させる。electron-vite は renderer の base を
         "./" に固定するため、/login のようなパスから ./assets/... が相対解決されると壊れる。
         app:// のカスタムプロトコルで正規のオリジンがあるので base で吸収できる（#25）。 -->
    <base href="/" />
    <meta charset="UTF-8" />
    <!-- style-src の unsafe-inline は Vite が開発時に CSS を <style> で注入するために必要。
         connect-src に Supabase を許可しないと認証のリクエストが CSP で弾かれる（#25）。
         プロジェクト ID は環境変数で変わるためワイルドカードにしている。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8080 https://*.supabase.co wss://*.supabase.co"
    />
    <title>メモ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
