services:
  postgres:
    image: postgres:15
    container_name: study_web_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: memo
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  hasura:
    image: hasura/graphql-engine:v2.20.0
    container_name: study_web_hasura
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    # Linux で host.docker.internal を使う場合に必要（Mac/Windows は不要）
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: "postgres://user:password@postgres:5432/memo"
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      # 平文の既定値は置かない（#89）。未設定なら起動時に落として気づけるようにする。
      HASURA_GRAPHQL_ADMIN_SECRET: "${HASURA_GRAPHQL_ADMIN_SECRET:?.env に設定してください}"
      # ローカルは全許可のまま。公開時は Web のオリジンに絞る（層 10 / #104）。
      HASURA_GRAPHQL_CORS_DOMAIN: "${HASURA_GRAPHQL_CORS_DOMAIN:-*}"
      # metadata/actions.yaml の handler が {{ACTION_BASE_URL}} で参照する。
      # host.docker.internal は Docker Desktop 固有の名前なのでクラウドでは解決できない。
      # 本番は Render の公開 URL を .env 相当の場所から渡す（層 9 / #103）。
      ACTION_BASE_URL: "${ACTION_BASE_URL:-http://host.docker.internal:3001}"
      # Supabase Auth が発行した JWT を検証する（Discussion #19）。
      # 非対称鍵（ES256）なので Hasura は JWKS から公開鍵を取得する。秘密鍵は持たない。
      # issuer / audience まで照合し、他プロジェクトのトークンを弾く。
      # SUPABASE_PROJECT_REF は .env から渡す（.env.example を参照）。
      HASURA_GRAPHQL_JWT_SECRET: >-
        {"jwk_url":"https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/.well-known/jwks.json",
         "issuer":"https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1",
         "audience":"authenticated",
         "claims_namespace":"https://hasura.io/jwt/claims"}
      # Actions のハンドラ（NestJS）へ付与する共有シークレット。
      # NestJS 側も同じ値を持ち、一致しないリクエストを 401 で弾く（#26）。
      HASURA_ACTION_SECRET: "${HASURA_ACTION_SECRET}"
      # HASURA_GRAPHQL_UNAUTHORIZED_ROLE は意図的に設定しない。
      # 設定すると未認証のリクエストがそのロールで通ってしまうため（#22 の AC）。

volumes:
  postgres-data:
    name: study_web_pgdata
