type Mutation {
  createDummy(
    content: String!
  ): DummyPayload
}

type Mutation {
  updateDummy(
    id: String!
    content: String!
  ): DummyPayload
}

type Mutation {
  deleteDummy(
    id: String!
  ): DeleteDummyPayload
}

type DummyPayload {
  id: String!
  content: String!
  createdAt: String!
  updatedAt: String!
}

type DeleteDummyPayload {
  id: String!
}
