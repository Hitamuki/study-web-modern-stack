actions:
  - name: createDummy
    definition:
      kind: synchronous
      handler: "{{ACTION_BASE_URL}}/hasura/actions/createDummy"
      timeout: 60
      # ハンドラを Hasura からの呼び出しだけに限定する共有シークレット。
      # Actions は Hasura のパーミッションを迂回するため、テーブルの権限では守れない。
      headers:
        - name: x-hasura-action-secret
          value_from_env: HASURA_ACTION_SECRET
    comment: Create dummy record via NestJS domain logic (Hasura Actions)
    permissions:
      - role: user
  - name: updateDummy
    definition:
      kind: synchronous
      handler: "{{ACTION_BASE_URL}}/hasura/actions/updateDummy"
      timeout: 60
      # ハンドラを Hasura からの呼び出しだけに限定する共有シークレット。
      # Actions は Hasura のパーミッションを迂回するため、テーブルの権限では守れない。
      headers:
        - name: x-hasura-action-secret
          value_from_env: HASURA_ACTION_SECRET
    comment: Update dummy record via NestJS domain logic (Hasura Actions)
    permissions:
      - role: user
  - name: deleteDummy
    definition:
      kind: synchronous
      handler: "{{ACTION_BASE_URL}}/hasura/actions/deleteDummy"
      timeout: 60
      # ハンドラを Hasura からの呼び出しだけに限定する共有シークレット。
      # Actions は Hasura のパーミッションを迂回するため、テーブルの権限では守れない。
      headers:
        - name: x-hasura-action-secret
          value_from_env: HASURA_ACTION_SECRET
    comment: Delete dummy record via NestJS domain logic (Hasura Actions)
    permissions:
      - role: user
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: DummyPayload
    - name: DeleteDummyPayload
  scalars: []
